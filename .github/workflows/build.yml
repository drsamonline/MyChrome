name: build

on:
  push:
    branches: [master, main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache AutoIt SDK
        uses: actions/cache@v4
        with:
          path: .build/autoit
          key: autoit-3.3.16.1-v1

      - name: Build with AutoIt3
        shell: pwsh
        env:
          SIGNING_PFX: ${{ secrets.SIGNING_PFX }}
          SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
        run: ./build/build.ps1

      - name: Documentation gate
        shell: pwsh
        run: ./build/check-docs.ps1

      - name: Smoke test sources and binaries
        shell: pwsh
        timeout-minutes: 10
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./build/smoke.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: mybrowser-windows
          path: |
            dist/*.7z
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Attest build provenance
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'dist/*.7z'

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.7z
            dist/*.zip
            dist/SHA256SUMS.txt
          body: |
            Portable multi-browser launcher built from source.

            Chrome is fetched from the official Chrome for Testing feed; Firefox,
            Chromium, Brave, Vivaldi and Edge from their own feeds.

            ---

            Verify an asset: `certutil -hashfile <file> SHA256` against `SHA256SUMS.txt`,
            or check it at https://www.virustotal.com/gui/home/search

            便攜式多瀏覽器啟動器，由原始碼建置。
            Chrome 取自官方 Chrome for Testing；Firefox、Chromium、Brave、Vivaldi、Edge 取自各自官方來源。
