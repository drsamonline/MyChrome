name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        `ROADMAP.md` lists what is planned and what has shipped — check there first.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve
      description: Describe the situation, not the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you would like to happen
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Browser support
        - Update engine
        - Interface
        - Documentation
        - Build and release
